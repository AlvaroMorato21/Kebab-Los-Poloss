<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Los Polos Kebab</title>
    <link rel="stylesheet" href="carrinho.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html"><img src="image 1.svg" alt=""></a>
            <h1 class="logo">Los Polos Kebab <br> Kebap şişleri</h1>
            <ul class="menu">
                <li><a href="cardapio.html">Cardápio</a></li>
                <li><a href="carrinho.html">Seus pedidos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>

            <a href="carrinho.html" id="carrinho">carrinho</a>
            <a href="login.html" id="login">fazer login</a>
        </nav>
    </header>

    <main class="carrinho-main">
        <div class="login-card carrinho-card">
            <h2>Seu carrinho</h2>
            <p class="login-sub" id="resumo">Nenhum item adicionado ainda.</p>

            <ul class="lista-carrinho" id="lista"></ul>

            <div class="total-carrinho">
                <span>Total</span>
                <span id="total">R$ 0,00</span>
            </div>

            <button type="button" class="login-button" id="finalizar">Finalizar pedido</button>
            <button type="button" class="botao-secundario" id="esvaziar">Esvaziar carrinho</button>
        </div>
    </main>

    <footer class="rodape">
        <img src="image 1.svg" alt="">
    </footer>

    <script src="carrinho.js"> </script>
</body>
</html>
