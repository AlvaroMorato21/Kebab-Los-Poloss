<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Los Polos Kebab</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html"><img src="image 1.svg" alt=""></a>
            <h1 class="logo">Los Polos Kebab <br> Kebap şişleri</h1>
            <ul class="menu">
                <li><a href="index.html">Cardápio</a></li>
                <li><a href="carrinho.html">Seus pedidos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>

            <a href="" id="carrinho">carrinho</a>
            <a href="login.html" id="login">fazer login</a>
        </nav>
    </header>
     <main class="login-main">
        <div class="login-card">
            <h2>Cadastro</h2>
            <p class="login-sub">Crie sua conta para fazer pedidos mais rápido e acompanhar seus dados!</p>

            <form id="form-login">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required />

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="voce@exemplo.com.br" required />

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(11) 99999-9999" required maxlength="15"/>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required />

                <label for="confirmar">Confirmar senha</label>
                <input type="password" id="confirmar" placeholder="Repita a senha" required />

                <button type="submit" class="login-button">Criar conta</button>
            </form>

            <p class="criar-conta">Já possui conta? <a href="login.html">Entrar</a></p>
        </div>
    </main>
    
    <footer class="rodape">
        <img src="image 1.svg" alt="">
        <h1>"© 2026 Los Polos Kebab. Todos os direitos reservados."</h1>
      </footer>

    <script src="cadastro.js">
       
    </script>
</body>
</html>
