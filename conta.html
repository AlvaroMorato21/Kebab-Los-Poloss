<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta - Los Polos Kebab</title>
    <link rel="stylesheet" href="conta.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html"><img src="image 1.svg" alt=""></a>
            <h1 class="logo">Los Polos Kebab <br> Kebap şişleri</h1>
            <ul class="menu">
                <li><a href="index.html">Cardápio</a></li>
                <li><a href="carrinho.html">Seus pedidos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>

            <a href="" id="carrinho">carrinho</a>
            <a href="conta.html" id="login">ver conta</a>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-card">
            <div class="avatar" id="avatar">?</div>
            <h2>Minha conta</h2>
            <p class="login-sub">Confira seus dados cadastrados.</p>

            <div class="dados">
                <div class="dado">
                    <span class="dado-titulo">Nome</span>
                    <span class="dado-valor" id="conta-nome">-</span>
                </div>
                <div class="dado">
                    <span class="dado-titulo">E-mail</span>
                    <span class="dado-valor" id="conta-email">-</span>
                </div>
                <div class="dado">
                    <span class="dado-titulo">Telefone</span>
                    <span class="dado-valor" id="conta-telefone">-</span>
                </div>
            </div>

            <button type="button" class="login-button" id="botao-sair">Sair da conta</button>
        </div>
    </main>

    <script src="conta.js"></script>
</body>
</html>
